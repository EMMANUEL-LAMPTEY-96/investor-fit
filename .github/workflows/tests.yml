name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LibreOffice (recalculates the Excel models in tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc
      - run: pip install -r requirements.txt openpyxl pytest
      - run: pytest -q
      - name: Skill zip and Claude Code plugin are up to date
        run: |
          python scripts/package_skill.py
          git status --porcelain plugins .claude-plugin skill/investor-fit-advisor/references
          test -z "$(git status --porcelain plugins .claude-plugin skill/investor-fit-advisor/references)" || (echo "Run python scripts/package_skill.py and commit the result" && exit 1)
