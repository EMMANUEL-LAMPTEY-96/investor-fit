name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/package_skill.py
      - name: Publish the release with the skill zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/investor-fit-advisor.zip \
            --title "Investor-Fit Agent $GITHUB_REF_NAME" \
            --notes "Download investor-fit-advisor.zip and upload it in Claude: Customize > Skills > Upload a skill. Claude Code: /plugin install investor-fit --marketplace ${GITHUB_REPOSITORY}"
