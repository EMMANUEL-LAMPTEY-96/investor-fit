name: release
# Publish a release on GitHub (Releases > Draft a new release) and this attaches the skill zip to it.
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  attach-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/package_skill.py
      - name: Attach the skill zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/investor-fit-advisor.zip --clobber
